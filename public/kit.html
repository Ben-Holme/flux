<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unyha Pixel Art Kit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0b12;
      min-height: 100vh;
      padding: 40px 32px 80px;
      font-family: 'Courier New', monospace;
    }
    h1 {
      color: #ffd98f;
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      text-shadow: #ffd98f 0 0 16px;
      margin-bottom: 40px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }
    .sprite-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #16131f;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .label {
      color: rgba(255,255,255,0.3);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .actions {
      margin-top: 48px;
      display: flex;
      gap: 12px;
    }
    button {
      background: rgba(44,38,64,0.8);
      color: #ffd98f;
      border: 1px solid rgba(255,217,143,0.25);
      padding: 10px 22px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 10px;
    }
    button:hover { background: #3d3555; }
  </style>
</head>

  const SCALE = 4;
  const grid = document.getElementById('grid');

  SPRITES.forEach(({ name, rows, w, h }) => {
    const card = document.createElement('div');
    card.className = 'sprite-card';

    const canvas = document.createElement('canvas');
    canvas.width  = w * SCALE;
    canvas.height = h * SCALE;
    const ctx = canvas.getContext('2d');

    rows.forEach((row, ry) => {
      for (let cx = 0; cx < row.length; cx++) {
        const ch = row[cx];
        if (ch === '0') continue;
        const col = P[ch];
        if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect(cx * SCALE, ry * SCALE, SCALE, SCALE);
      }
    });

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = name;

    card.appendChild(canvas);
    card.appendChild(label);
    grid.appendChild(card);
  });

  // ── DOWNLOAD SHEET ──────────────────────────────────────────────────────────
  function dlAll() {
    const COLS   = 6;
    const PAD    = 16;
    const CELL   = 16 * SCALE;
    const rows   = Math.ceil(SPRITES.length / COLS);
    const sheet  = document.createElement('canvas');
    sheet.width  = COLS * (CELL + PAD) + PAD;
    sheet.height = rows * (CELL + PAD * 2) + PAD;
    const ctx = sheet.getContext('2d');
    ctx.fillStyle = '#0d0b12';
    ctx.fillRect(0, 0, sheet.width, sheet.height);

    SPRITES.forEach(({ rows: spriteRows, w, h }, idx) => {
      const col = idx % COLS;
      const row = Math.floor(idx / COLS);
      const ox  = PAD + col * (CELL + PAD);
      const oy  = PAD + row * (CELL + PAD * 2);
      spriteRows.forEach((rowStr, ry) => {
        for (let cx = 0; cx < rowStr.length; cx++) {
          const ch = rowStr[cx];
          if (ch === '0') continue;
          const colour = P[ch];
          if (!colour) continue;
          ctx.fillStyle = colour;
          ctx.fillRect(ox + cx * SCALE, oy + ry * SCALE, SCALE, SCALE);
        }
      });
    });

    const a = document.createElement('a');
    a.download = 'unyha-kit.png';
    a.href = sheet.toDataURL();
    a.click();
  }
